  "ASYNC105", # Call to {method_name} is not immediately awaited
  "ASYNC109", # Async function definition with a timeout parameter
  "ASYNC110", # Use {module}.Event instead of awaiting {module}.sleep in a while loop
  "ASYNC115", # Use {module}.lowlevel.checkpoint() instead of {module}.sleep(0)
  "ASYNC116", # {module}.sleep() with >24 hour interval should usually be {module}.sleep_forever()
  "ASYNC210", # Async functions should not call blocking HTTP methods
  "ASYNC212", # Blocking httpx method {name}.{call}() in async context, use httpx.AsyncClient
  "ASYNC220", # Async functions should not create subprocesses with blocking methods
  "ASYNC221", # Async functions should not run processes with blocking methods
  "ASYNC222", # Async functions should not wait on processes with blocking methods
  "ASYNC230", # Async functions should not open files with blocking methods like open
  "ASYNC240", # Async functions should not use {path_library} methods, use trio.Path or anyio.path
  "ASYNC250", # Blocking call to input() in async context
  "ASYNC251", # Async functions should not call time.sleep

  # flake8-boolean-trap
  "FBT001", # Boolean-typed positional argument in function definition
  "FBT002", # Boolean default positional argument in function definition
  "FBT003", # Boolean positional value in function call

  # flake8-bugbear
